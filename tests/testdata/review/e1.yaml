apiVersion: v1
kind: ConfigMap
metadata:
  name: defaults
data:
  GOMEMLIMIT: "900MiB"
---
apiVersion: v1
kind: Pod
metadata:
  name: p
spec:
  containers:
  - name: app
    image: x
    resources:
      limits:
        memory: 1Gi
    envFrom:
    - configMapRef:
        name: defaults
    - secretRef:
        name: overrides
---
