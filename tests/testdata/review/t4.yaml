apiVersion: v1
kind: ConfigMap
metadata:
  name: defaults
data:
  GOMEMLIMIT: "800"
---
apiVersion: v1
kind: Pod
metadata:
  name: p
spec:
  containers:
  - name: app
    image: x
    resources:
      limits:
        memory: 1Gi
    envFrom:
    - configMapRef:
        name: defaults
    env:
    - name: GOMEMLIMIT
      valueFrom:
        configMapKeyRef:
          name: defaults
          key: GOMEMLIMIT_OVERRIDE
          optional: true
---
